<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5b7fa6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ぬくもりノート</title>
<style>
:root {
  --blue:    #5b7fa6;
  --blue2:   #3d5c80;
  --soft:    #e8f0f8;
  --bg:      #f5f7fa;
  --bg2:     #eef1f6;
  --card:    #ffffff;
  --text:    #2c3a4a;
  --muted:   #8a9ab0;
  --border:  #dde4ee;
  --green:   #4caf7d;
  --orange:  #e8923a;
  --red:     #d95f5f;
  --yellow:  #f0c040;
  --nav-h:   60px;
  --safe-b:  env(safe-area-inset-bottom, 0px);
  --safe-t:  env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Hiragino Sans', 'Meiryo', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* TOP BAR */
.topbar {
  background: var(--blue2);
  padding: 12px 16px;
  padding-top: calc(12px + var(--safe-t));
  display: flex; align-items: center; flex-shrink: 0;
}
.topbar-title { color: #fff; font-size: 18px; font-weight: 700; flex: 1; letter-spacing: .03em; }
.topbar-sub { color: rgba(255,255,255,.65); font-size: 12px; }

/* VIEWS */
.view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

/* BOTTOM NAV */
.bottom-nav {
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b); flex-shrink: 0;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: none; background: transparent; cursor: pointer; color: var(--muted);
  font-size: 9px; font-weight: 600; letter-spacing: .03em; transition: color .15s; padding: 0; position: relative;
}
.nav-item.active { color: var(--blue); }
.nav-item.active::before {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 3px;
  background: var(--blue); border-radius: 0 0 4px 4px;
}
.nav-icon { font-size: 22px; line-height: 1; }

/* ════ 記録ビュー ════ */
#view-record { background: var(--bg); }
.record-scroll { flex: 1; overflow-y: auto; padding: 16px 14px 100px; }
.section-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; margin-top: 20px; }
.section-label:first-child { margin-top: 0; }

/* カテゴリグリッド */
.cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cat-card {
  background: var(--card); border: 2px solid var(--border); border-radius: 14px;
  padding: 14px 10px; text-align: center; cursor: pointer; transition: all .15s;
  display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative;
}
.cat-card:active { transform: scale(.96); }
.cat-card.selected { border-color: var(--blue); background: var(--soft); }
.cat-check {
  position: absolute; top: 6px; right: 6px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--blue); color: #fff;
  font-size: 12px; font-weight: 900;
  display: none; align-items: center; justify-content: center;
}
.cat-card.selected .cat-check { display: flex; }
.cat-emoji { font-size: 28px; }
.cat-name { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }

/* 深刻度 */
.severity-row { display: flex; gap: 8px; }
.sev-btn {
  flex: 1; padding: 10px 4px; border-radius: 12px; border: 2px solid var(--border);
  background: var(--card); cursor: pointer; font-size: 12px; font-weight: 700;
  color: var(--muted); text-align: center; transition: all .15s;
}
.sev-btn:active { transform: scale(.96); }
.sev-btn.s1.selected { background: #e8f5ee; border-color: var(--green); color: var(--green); }
.sev-btn.s2.selected { background: #fff8e0; border-color: var(--yellow); color: #b8860b; }
.sev-btn.s3.selected { background: #fff0e0; border-color: var(--orange); color: var(--orange); }
.sev-btn.s4.selected { background: #fde8e8; border-color: var(--red); color: var(--red); }

/* メモ入力 */
.memo-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 12px 14px; font-size: 15px; background: var(--card); color: var(--text);
  min-height: 80px; resize: none; font-family: inherit;
}
.memo-input:focus { outline: none; border-color: var(--blue); }

/* 日時 */
.datetime-row { display: flex; gap: 8px; }
.datetime-input {
  flex: 1; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px;
  font-size: 14px; background: var(--card); color: var(--text); font-family: inherit;
}
.datetime-input:focus { outline: none; border-color: var(--blue); }

/* 保存ボタン */
.save-fab {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); left: 16px; right: 16px;
  background: var(--blue); color: #fff; border: none; border-radius: 16px;
  height: 54px; font-size: 16px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 20px rgba(91,127,166,.4); transition: transform .1s; z-index: 10;
}
.save-fab:active { transform: scale(.98); }
.save-fab:disabled { opacity: .45; background: var(--muted); box-shadow: none; }

/* ════ 一覧ビュー ════ */
#view-list { background: var(--bg); flex-direction: column; }
.list-header { padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-btn { width: 34px; height: 34px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); cursor: pointer; font-size: 16px; color: var(--blue); display: flex; align-items: center; justify-content: center; font-weight: 700; }
.month-label { font-size: 16px; font-weight: 800; color: var(--text); min-width: 90px; text-align: center; }
.list-count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
.list-scroll { flex: 1; overflow-y: auto; padding: 12px 14px 20px; }
.day-group { margin-bottom: 16px; }
.day-label { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
.record-card {
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
  padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; position: relative;
}
.rec-emoji { font-size: 26px; flex-shrink: 0; }
.rec-body { flex: 1; min-width: 0; }
.rec-name { font-size: 14px; font-weight: 700; color: var(--text); }
.rec-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.rec-cat-chip { font-size: 11px; background: var(--soft); color: var(--blue); padding: 2px 8px; border-radius: 8px; font-weight: 600; }
.rec-memo { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
.rec-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
.rec-sev { position: absolute; top: 12px; right: 40px; width: 10px; height: 10px; border-radius: 50%; }
.sev-dot-1 { background: var(--green); }
.sev-dot-2 { background: var(--yellow); }
.sev-dot-3 { background: var(--orange); }
.sev-dot-4 { background: var(--red); }
.delete-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; flex-shrink: 0; position: absolute; top: 10px; right: 10px; }
.list-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; line-height: 1.8; }

/* ════ レポートビュー ════ */
#view-report { background: var(--bg); flex-direction: column; }
.report-scroll { flex: 1; overflow-y: auto; padding: 16px 14px 24px; }
.report-header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.month-nav-bar { display: flex; align-items: center; gap: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 14px 8px; text-align: center; }
.stat-num { font-size: 26px; font-weight: 900; color: var(--blue); }
.stat-label { font-size: 10px; color: var(--muted); margin-top: 3px; font-weight: 600; }
.report-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 16px; margin-bottom: 14px; }
.report-card-title { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 14px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar-row-label { font-size: 12px; color: var(--text); width: 100px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-bg { flex: 1; height: 18px; background: var(--bg2); border-radius: 9px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--blue); border-radius: 9px; transition: width .5s; }
.bar-count { font-size: 12px; font-weight: 700; color: var(--blue); width: 24px; text-align: right; flex-shrink: 0; }
.week-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 80px; gap: 4px; }
.week-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.week-bar { width: 100%; background: var(--soft); border-radius: 6px 6px 0 0; min-height: 4px; transition: height .4s; }
.week-bar.has-data { background: var(--blue); }
.week-day { font-size: 9px; color: var(--muted); }
.sev-dist { display: flex; gap: 8px; }
.sev-item { flex: 1; background: var(--bg2); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sev-item-num { font-size: 20px; font-weight: 900; }
.sev-item-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ════ 報告書ビュー ════ */
#view-doc { background: var(--bg); flex-direction: column; }
.doc-header { padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.doc-scroll { flex: 1; overflow-y: auto; padding: 16px 14px 24px; }

.doc-month-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }

.doc-card {
  background: var(--card); border-radius: 16px; border: 1px solid var(--border);
  padding: 18px 16px; margin-bottom: 14px;
}
.doc-title {
  font-size: 16px; font-weight: 800; color: var(--blue2);
  border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.doc-section { margin-bottom: 16px; }
.doc-section-title { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.doc-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--bg2); font-size: 14px; }
.doc-row:last-child { border-bottom: none; }
.doc-row-label { color: var(--text); }
.doc-row-val { font-weight: 700; color: var(--blue2); }
.sev-bar-row { display: flex; gap: 6px; align-items: center; padding: 5px 0; }
.sev-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.doc-episode { background: var(--bg2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.doc-episode-head { font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 4px; }
.doc-episode-text { font-size: 13px; color: var(--text); line-height: 1.6; }
.doc-empty { color: var(--muted); font-size: 13px; font-style: italic; }
.doc-footer { font-size: 11px; color: var(--muted); text-align: right; margin-top: 4px; }

.doc-actions { display: flex; gap: 10px; margin-top: 4px; }
.doc-btn {
  flex: 1; padding: 14px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.doc-btn-copy { background: var(--soft); color: var(--blue); }
.doc-btn-share { background: var(--blue); color: #fff; }
.doc-btn:active { opacity: .8; }

/* TOAST */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-b) + 80px); left: 16px; right: 16px;
  background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px;
  font-size: 14px; font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; z-index: 300;
}
.toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-title">🍀 ぬくもりノート</div>
    <div class="topbar-sub" id="top-sub">大切な人の記録</div>
  </div>
</div>

<!-- ══ 記録 VIEW ══ -->
<div class="view active" id="view-record">
  <div class="record-scroll">
    <div class="section-label">どんなことがありましたか？（複数選択できます）</div>
    <div class="cat-grid" id="cat-grid"></div>

    <div class="section-label">程度</div>
    <div class="severity-row">
      <button class="sev-btn s1 selected" data-sev="1" onclick="selectSev(this)">🟢<br>軽い</button>
      <button class="sev-btn s2" data-sev="2" onclick="selectSev(this)">🟡<br>やや気になる</button>
      <button class="sev-btn s3" data-sev="3" onclick="selectSev(this)">🟠<br>心配</button>
      <button class="sev-btn s4" data-sev="4" onclick="selectSev(this)">🔴<br>深刻</button>
    </div>

    <div class="section-label">日時</div>
    <div class="datetime-row">
      <input class="datetime-input" type="date" id="rec-date">
      <input class="datetime-input" type="time" id="rec-time">
    </div>

    <div class="section-label">メモ（任意）</div>
    <textarea class="memo-input" id="rec-memo" placeholder="状況を詳しく書くと医師に伝えやすくなります&#10;例：夕食後、同じ質問を3回繰り返した"></textarea>
  </div>
  <button class="save-fab" id="save-btn" onclick="saveRecord()" disabled>症状を選んでください</button>
</div>

<!-- ══ 一覧 VIEW ══ -->
<div class="view" id="view-list">
  <div class="list-header">
    <div class="month-nav">
      <button class="month-btn" onclick="changeListMonth(-1)">‹</button>
      <div class="month-label" id="list-month-label"></div>
      <button class="month-btn" onclick="changeListMonth(1)">›</button>
    </div>
    <div class="list-count" id="list-count"></div>
  </div>
  <div class="list-scroll" id="list-scroll"></div>
</div>

<!-- ══ レポート VIEW ══ -->
<div class="view" id="view-report">
  <div class="report-scroll">
    <div class="report-header-row">
      <div class="month-nav-bar">
        <button class="month-btn" onclick="changeReportMonth(-1)">‹</button>
        <div class="month-label" id="report-month-label"></div>
        <button class="month-btn" onclick="changeReportMonth(1)">›</button>
      </div>
    </div>
    <div class="stat-row" id="stat-row"></div>
    <div class="report-card">
      <div class="report-card-title">📊 カテゴリ別 頻度</div>
      <div id="cat-bars"></div>
    </div>
    <div class="report-card">
      <div class="report-card-title">📅 週ごとの記録件数</div>
      <div class="week-chart" id="week-chart"></div>
    </div>
    <div class="report-card">
      <div class="report-card-title">🔴 深刻度の内訳</div>
      <div class="sev-dist" id="sev-dist"></div>
    </div>
  </div>
</div>

<!-- ══ 報告書 VIEW ══ -->
<div class="view" id="view-doc">
  <div class="doc-scroll">
    <div class="doc-month-row">
      <button class="month-btn" onclick="changeDocMonth(-1)">‹</button>
      <div class="month-label" id="doc-month-label"></div>
      <button class="month-btn" onclick="changeDocMonth(1)">›</button>
    </div>
    <div id="doc-content"></div>
    <div class="doc-actions" id="doc-actions" style="display:none">
      <button class="doc-btn doc-btn-copy" onclick="copyReport()">📋 コピー</button>
      <button class="doc-btn doc-btn-share" onclick="shareReport()">📤 共有</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-record" onclick="showView('record',this)">
    <span class="nav-icon">✏️</span>記録する
  </button>
  <button class="nav-item" id="nav-list" onclick="showView('list',this)">
    <span class="nav-icon">📋</span>一覧
  </button>
  <button class="nav-item" id="nav-report" onclick="showView('report',this)">
    <span class="nav-icon">📊</span>レポート
  </button>
  <button class="nav-item" id="nav-doc" onclick="showView('doc',this)">
    <span class="nav-icon">🏥</span>報告書
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  { id: 'repeat', emoji: '🔁', name: '同じことを\n何度も聞く' },
  { id: 'name',   emoji: '👤', name: '名前・言葉が\n出てこない' },
  { id: 'forgot', emoji: '📅', name: '約束・予定を\n忘れた' },
  { id: 'place',  emoji: '🔍', name: '物の置き場所\nがわからない' },
  { id: 'date',   emoji: '📆', name: '日付・曜日が\nわからない' },
  { id: 'lost',   emoji: '🗺️', name: '道に迷った' },
  { id: 'meal',   emoji: '🍽️', name: '食事したか\n忘れた' },
  { id: 'other',  emoji: '💬', name: 'その他' },
];
const SEV_COLORS = { 1:'#4caf7d', 2:'#f0c040', 3:'#e8923a', 4:'#d95f5f' };
const SEV_LABELS = { 1:'軽い', 2:'やや気になる', 3:'心配', 4:'深刻' };

let selectedCats = new Set();
let selectedSev = 1;
let listMonth = new Date(), reportMonth = new Date(), docMonth = new Date();

const $ = id => document.getElementById(id);
function toast(msg, dur = 2200) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}
function fmtMonth(d) { return `${d.getFullYear()}年${d.getMonth()+1}月`; }
function pad2(n) { return String(n).padStart(2,'0'); }

function getRecords() { return JSON.parse(localStorage.getItem('kaigo_records') || '[]'); }
function saveRecords(r) { localStorage.setItem('kaigo_records', JSON.stringify(r)); }

// 旧フォーマット（catId単体）を新フォーマット（categories配列）に統一
function normRecord(r) {
  if (!r.categories) {
    r.categories = [{ id: r.catId, emoji: r.catEmoji, name: r.catName }];
  }
  return r;
}

// ── VIEWS ────────────────────────────────────────────────────────────────────
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  $('view-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'list')   renderList();
  if (name === 'report') renderReport();
  if (name === 'doc')    renderDoc();
}

// ── 記録フォーム ──────────────────────────────────────────────────────────────
function buildCatGrid() {
  $('cat-grid').innerHTML = CATEGORIES.map(c => `
    <div class="cat-card" data-id="${c.id}" onclick="toggleCat(this,'${c.id}')">
      <div class="cat-check">✓</div>
      <div class="cat-emoji">${c.emoji}</div>
      <div class="cat-name">${c.name.replace('\n','<br>')}</div>
    </div>`).join('');
}

function toggleCat(el, id) {
  if (selectedCats.has(id)) {
    selectedCats.delete(id);
    el.classList.remove('selected');
  } else {
    selectedCats.add(id);
    el.classList.add('selected');
  }
  updateSaveBtn();
}

function selectSev(el) {
  selectedSev = +el.dataset.sev;
  document.querySelectorAll('.sev-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function updateSaveBtn() {
  const btn = $('save-btn');
  btn.disabled = selectedCats.size === 0;
  btn.textContent = selectedCats.size === 0
    ? '症状を選んでください'
    : `${selectedCats.size}件を記録する ✓`;
}

function initDatetime() {
  const now = new Date();
  $('rec-date').value = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
  $('rec-time').value = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
}

function saveRecord() {
  if (selectedCats.size === 0) return;
  const cats = Array.from(selectedCats).map(id => CATEGORIES.find(c => c.id === id));
  const rec = {
    id: Date.now(),
    categories: cats,
    severity: selectedSev,
    date: $('rec-date').value,
    time: $('rec-time').value,
    memo: $('rec-memo').value.trim(),
    createdAt: new Date().toISOString(),
  };
  const records = getRecords();
  records.unshift(rec);
  saveRecords(records);

  selectedCats.clear();
  document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('selected'));
  selectedSev = 1;
  document.querySelectorAll('.sev-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('.sev-btn.s1').classList.add('selected');
  $('rec-memo').value = '';
  initDatetime();
  updateSaveBtn();
  toast('🍀 記録しました');
}

// ── 一覧 ──────────────────────────────────────────────────────────────────────
function changeListMonth(d) {
  listMonth = new Date(listMonth.getFullYear(), listMonth.getMonth() + d, 1);
  renderList();
}

function renderList() {
  $('list-month-label').textContent = fmtMonth(listMonth);
  const ym = `${listMonth.getFullYear()}-${pad2(listMonth.getMonth()+1)}`;
  const all = getRecords().filter(r => r.date.startsWith(ym)).map(normRecord);
  $('list-count').textContent = `${all.length}件`;

  if (!all.length) {
    $('list-scroll').innerHTML = `<div class="list-empty">この月の記録はありません<br><span style="font-size:13px">「記録する」タブから追加できます</span></div>`;
    return;
  }

  const groups = {};
  all.forEach(r => { if (!groups[r.date]) groups[r.date] = []; groups[r.date].push(r); });

  $('list-scroll').innerHTML = Object.keys(groups).sort().reverse().map(date => {
    const d = new Date(date + 'T00:00:00');
    const dayStr = `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
    return `<div class="day-group">
      <div class="day-label">${dayStr}</div>
      ${groups[date].map(r => `
        <div class="record-card" id="rc-${r.id}">
          <div class="rec-emoji">${r.categories[0].emoji}</div>
          <div class="rec-body">
            <div class="rec-cats">
              ${r.categories.map(c => `<span class="rec-cat-chip">${c.emoji} ${c.name.replace('\n','')}</span>`).join('')}
            </div>
            ${r.memo ? `<div class="rec-memo">${r.memo}</div>` : ''}
            <div class="rec-time">${r.time}</div>
          </div>
          <div class="rec-sev sev-dot-${r.severity}"></div>
          <button class="delete-btn" onclick="deleteRecord(${r.id})">🗑</button>
        </div>`).join('')}
    </div>`;
  }).join('');
}

function deleteRecord(id) {
  saveRecords(getRecords().filter(r => r.id !== id));
  renderList();
  toast('削除しました');
}

// ── レポート ──────────────────────────────────────────────────────────────────
function changeReportMonth(d) {
  reportMonth = new Date(reportMonth.getFullYear(), reportMonth.getMonth() + d, 1);
  renderReport();
}

function renderReport() {
  $('report-month-label').textContent = fmtMonth(reportMonth);
  const ym = `${reportMonth.getFullYear()}-${pad2(reportMonth.getMonth()+1)}`;
  const all = getRecords().filter(r => r.date.startsWith(ym)).map(normRecord);

  const sevCounts = { 1:0, 2:0, 3:0, 4:0 };
  const catCounts = {};
  const dayCounts = {};
  all.forEach(r => {
    sevCounts[r.severity]++;
    r.categories.forEach(c => {
      const key = c.name.replace('\n','');
      catCounts[key] = (catCounts[key] || 0) + 1;
    });
    dayCounts[r.date] = (dayCounts[r.date] || 0) + 1;
  });

  const daysWithRecord = Object.keys(dayCounts).length;
  const maxSev = all.length ? Math.max(...all.map(r => r.severity)) : 0;

  $('stat-row').innerHTML = `
    <div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-label">総記録数</div></div>
    <div class="stat-card"><div class="stat-num">${daysWithRecord}</div><div class="stat-label">記録のある日</div></div>
    <div class="stat-card"><div class="stat-num" style="font-size:16px;padding-top:4px">${maxSev ? SEV_LABELS[maxSev] : 'なし'}</div><div class="stat-label">最高深刻度</div></div>`;

  const maxCount = Math.max(...Object.values(catCounts), 1);
  const sorted = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);
  $('cat-bars').innerHTML = sorted.length
    ? sorted.map(([name, cnt]) => `
        <div class="bar-row">
          <div class="bar-row-label">${name}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(cnt/maxCount*100)}%"></div></div>
          <div class="bar-count">${cnt}</div>
        </div>`).join('')
    : '<div style="color:var(--muted);font-size:13px">データなし</div>';

  const weeks = [0,0,0,0];
  const weekLabels = [];
  const y = reportMonth.getFullYear(), m = reportMonth.getMonth();
  const lastDay = new Date(y, m+1, 0).getDate();
  [[1,7],[8,14],[15,21],[22,lastDay]].forEach(([s,e], i) => {
    weekLabels.push(`${s}〜${e}日`);
    for (let d = s; d <= e; d++) {
      const key = `${y}-${pad2(m+1)}-${pad2(d)}`;
      weeks[i] += dayCounts[key] || 0;
    }
  });
  const maxWeek = Math.max(...weeks, 1);
  $('week-chart').innerHTML = weeks.map((cnt, i) => `
    <div class="week-col">
      <div class="week-bar ${cnt>0?'has-data':''}" style="height:${Math.max(4,Math.round(cnt/maxWeek*64))}px"></div>
      <div class="week-day">${weekLabels[i]}</div>
    </div>`).join('');

  $('sev-dist').innerHTML = [1,2,3,4].map(s => `
    <div class="sev-item">
      <div class="sev-item-num" style="color:${SEV_COLORS[s]}">${sevCounts[s]}</div>
      <div class="sev-item-label">${SEV_LABELS[s]}</div>
    </div>`).join('');
}

// ── 医師への報告書 ────────────────────────────────────────────────────────────
function changeDocMonth(d) {
  docMonth = new Date(docMonth.getFullYear(), docMonth.getMonth() + d, 1);
  renderDoc();
}

function buildReportText(all, month) {
  const catCounts = {};
  const sevCounts = { 1:0, 2:0, 3:0, 4:0 };
  all.forEach(r => {
    sevCounts[r.severity]++;
    r.categories.forEach(c => {
      const key = c.name.replace('\n','');
      catCounts[key] = (catCounts[key] || 0) + 1;
    });
  });
  const sorted = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]);
  const notable = all.filter(r => r.severity >= 3 && r.memo);

  let text = `【生活記録レポート ${month}】\n`;
  text += `記録総数: ${all.length}件\n\n`;
  text += `■ 気になった症状\n`;
  sorted.forEach(([name,cnt]) => { text += `・${name}: ${cnt}回\n`; });
  text += `\n■ 深刻度の内訳\n`;
  text += `軽い:${sevCounts[1]}件 / やや気になる:${sevCounts[2]}件 / 心配:${sevCounts[3]}件 / 深刻:${sevCounts[4]}件\n`;
  if (notable.length) {
    text += `\n■ 特に気になったエピソード\n`;
    notable.slice(0,5).forEach(r => {
      text += `・${r.date} ${r.time} [${SEV_LABELS[r.severity]}]\n  ${r.categories.map(c=>c.name.replace('\n','')).join('・')}\n  ${r.memo}\n`;
    });
  }
  text += `\n（ぬくもりノートより出力）`;
  return text;
}

function renderDoc() {
  $('doc-month-label').textContent = fmtMonth(docMonth);
  const ym = `${docMonth.getFullYear()}-${pad2(docMonth.getMonth()+1)}`;
  const all = getRecords().filter(r => r.date.startsWith(ym)).map(normRecord);
  const content = $('doc-content');
  const actions = $('doc-actions');

  if (!all.length) {
    content.innerHTML = `<div class="doc-card"><div class="doc-empty">この月の記録がありません。<br>「記録する」タブから症状を追加してください。</div></div>`;
    actions.style.display = 'none';
    return;
  }

  const catCounts = {};
  const sevCounts = { 1:0, 2:0, 3:0, 4:0 };
  const dayCounts = {};
  all.forEach(r => {
    sevCounts[r.severity]++;
    dayCounts[r.date] = (dayCounts[r.date] || 0) + 1;
    r.categories.forEach(c => {
      const key = c.name.replace('\n','');
      catCounts[key] = (catCounts[key] || 0) + 1;
    });
  });
  const sorted = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]);
  const notable = all.filter(r => r.severity >= 3 && r.memo).slice(0,5);

  content.innerHTML = `
    <div class="doc-card">
      <div class="doc-title">🏥 医師への生活記録レポート</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px">${fmtMonth(docMonth)}の記録  /  合計 ${all.length}件  /  記録日数 ${Object.keys(dayCounts).length}日</div>

      <div class="doc-section">
        <div class="doc-section-title">気になった症状</div>
        ${sorted.map(([name,cnt]) => `
          <div class="doc-row">
            <div class="doc-row-label">${name}</div>
            <div class="doc-row-val">${cnt}回</div>
          </div>`).join('')}
      </div>

      <div class="doc-section">
        <div class="doc-section-title">深刻度の内訳</div>
        ${[1,2,3,4].map(s => `
          <div class="sev-bar-row">
            <div class="sev-dot" style="background:${SEV_COLORS[s]}"></div>
            <div style="font-size:13px;flex:1">${SEV_LABELS[s]}</div>
            <div style="font-size:13px;font-weight:700;color:${SEV_COLORS[s]}">${sevCounts[s]}件</div>
          </div>`).join('')}
      </div>

      ${notable.length ? `
      <div class="doc-section">
        <div class="doc-section-title">特に気になったエピソード</div>
        ${notable.map(r => `
          <div class="doc-episode">
            <div class="doc-episode-head">${r.date} ${r.time}　${r.categories.map(c=>c.emoji+c.name.replace('\n','')).join(' / ')}　<span style="color:${SEV_COLORS[r.severity]}">[${SEV_LABELS[r.severity]}]</span></div>
            <div class="doc-episode-text">${r.memo}</div>
          </div>`).join('')}
      </div>` : ''}

      <div class="doc-footer">ぬくもりノートより出力</div>
    </div>`;

  actions.style.display = 'flex';
}

function copyReport() {
  const ym = `${docMonth.getFullYear()}-${pad2(docMonth.getMonth()+1)}`;
  const all = getRecords().filter(r => r.date.startsWith(ym)).map(normRecord);
  if (!all.length) return;
  const text = buildReportText(all, fmtMonth(docMonth));
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('📋 クリップボードにコピーしました'));
  } else {
    const el = document.createElement('textarea');
    el.value = text; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    toast('📋 コピーしました');
  }
}

function shareReport() {
  const ym = `${docMonth.getFullYear()}-${pad2(docMonth.getMonth()+1)}`;
  const all = getRecords().filter(r => r.date.startsWith(ym)).map(normRecord);
  if (!all.length) return;
  const text = buildReportText(all, fmtMonth(docMonth));
  if (navigator.share) {
    navigator.share({ title: `生活記録レポート ${fmtMonth(docMonth)}`, text });
  } else {
    copyReport();
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────
buildCatGrid();
initDatetime();
updateSaveBtn();
renderList();
renderReport();
renderDoc();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
